name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install mise-managed tools
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install backend dependencies
        working-directory: backend
        run: mix deps.get

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend quality checks
        working-directory: backend
        run: mix quality

      - name: Ash codegen check
        working-directory: backend
        run: mix codegen.check

      - name: Backend tests
        working-directory: backend
        run: mix test
        env:
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432

      - name: Frontend type check
        working-directory: frontend
        run: npm run check

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

  production-smoke:
    name: Production image smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install mise-managed tools
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build production image
        run: docker build --tag template-app:smoke .

      - name: Start production image
        run: >-
          docker run --detach --name template-app-smoke --network host
          --env DATABASE_URL=ecto://postgres:postgres@127.0.0.1:5432/test_db
          --env SECRET_KEY_BASE=production-smoke-secret-key-base
          --env TOKEN_SIGNING_SECRET=production-smoke-token-secret
          --env ASH_AUTH_SIGNING_SECRET=production-smoke-ash-secret
          --env PHX_HOST=app.example.com
          --env FRONTEND_URL=https://app.example.com
          --env FORCE_SSL=true
          --env TRUST_PROXY_HEADERS=true
          --env LOG_LEVEL=warning
          template-app:smoke

      - name: Wait for production image
        run: >-
          curl --fail --silent --show-error --retry 30 --retry-delay 1
          --retry-connrefused --header 'x-forwarded-proto: https'
          --header 'host: app.example.com' http://127.0.0.1:4000/

      - name: Run production browser smoke
        working-directory: frontend
        env:
          PRODUCTION_BASE_URL: http://127.0.0.1:4000
        run: npx playwright test --config=playwright.production.config.ts

      - name: Show production image logs on failure
        if: failure()
        run: docker logs template-app-smoke

      - name: Stop production image
        if: always()
        run: docker rm --force template-app-smoke || true

  tilt-validation:
    name: Tilt workflow validation
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
      TILT_VERSION: 0.37.7

    steps:
      - uses: actions/checkout@v4

      - name: Install mise-managed tools
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate pinned Tilt and shell lifecycle
        run: |
          tilt_version="$(mise exec "tilt@${TILT_VERSION}" -- tilt version)"
          [[ "$tilt_version" == "v${TILT_VERSION},"* ]]
          mise run tilt:validate

      - name: Validate Compose and Mise task registration
        run: |
          docker compose -f docker-compose.db.yml config --quiet
          mise tasks | rg -q '^tilt[[:space:]]'
          mise tasks | rg -q '^tilt:validate[[:space:]]'

      - name: Run Tilt CI and inspect resources
        run: |
          set -Eeuo pipefail
          snapshot="${RUNNER_TEMP}/tilt-snapshot.json"
          log="${RUNNER_TEMP}/tilt.log"
          resources="${RUNNER_TEMP}/tilt-resources.txt"
          tilt_pid=""

          cleanup() {
            local status=$?
            trap - EXIT INT TERM

            if [[ -n "$tilt_pid" ]]; then
              kill -INT "$tilt_pid" 2>/dev/null || true
              wait "$tilt_pid" 2>/dev/null || true
            fi

            exit "$status"
          }

          trap cleanup EXIT INT TERM

          mise exec "tilt@${TILT_VERSION}" -- tilt ci \
            --timeout=8m \
            --output-snapshot-on-exit "$snapshot" \
            >"$log" 2>&1 &
          tilt_pid=$!

          for _ in {1..90}; do
            if mise exec "tilt@${TILT_VERSION}" -- tilt get uiresources -o name >"$resources" 2>/dev/null; then
              if rg -q 'database|hooks|backend|frontend' "$resources"; then
                break
              fi
            fi
            sleep 1
          done

          for resource in database hooks backend frontend; do
            rg -q "$resource" "$resources" || {
              printf 'Tilt resource was not discovered: %s\n' "$resource" >&2
              exit 1
            }
          done

          set +e
          wait "$tilt_pid"
          tilt_status=$?
          set -e
          tilt_pid=""

          printf 'Tilt resource inventory:\n'
          cat "$resources"
          exit "$tilt_status"

      - name: Upload Tilt diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tilt-validation-diagnostics
          path: |
            ${{ runner.temp }}/tilt.log
            ${{ runner.temp }}/tilt-resources.txt
            ${{ runner.temp }}/tilt-snapshot.json
          if-no-files-found: ignore

      - name: Stop Tilt resources and retain database volume
        if: always()
        run: |
          timeout 60s mise exec "tilt@${TILT_VERSION}" -- tilt down || true
          timeout 30s docker compose -f docker-compose.db.yml down || true

  dependency-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install mise-managed tools
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend audit
        working-directory: frontend
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=moderate --json >"${RUNNER_TEMP}/npm-audit.json"
          audit_status=$?
          set -e

          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'));

          for (const [name, vulnerability] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = (vulnerability.via ?? [])
              .filter((entry) => typeof entry === 'object')
              .map((entry) => entry.url ?? String(entry.source ?? 'unknown-advisory'));
            const paths = vulnerability.nodes ?? [];
            console.log(`${name}: advisories=${advisories.join(',') || 'dependency metadata'} paths=${paths.join(',') || 'unknown'}`);
          }
          NODE

          exit "$audit_status"

      - name: Frontend production audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=moderate

      - name: Backend Hex audit
        working-directory: backend
        continue-on-error: true
        run: |
          mix deps.get
          mix hex.audit 2>&1 | tee "${RUNNER_TEMP}/mix-hex-audit.txt"

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            ${{ runner.temp }}/npm-audit.json
            ${{ runner.temp }}/mix-hex-audit.txt
          if-no-files-found: ignore
