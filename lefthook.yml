# Lefthook configuration for pre-commit hooks
# Automatically checks code quality for both Elixir and frontend code

pre-commit:
  parallel: true
  commands:
    # Elixir formatting - auto-fix and stage changes
    elixir-format:
      glob: "backend/{lib,test,config,priv}/**/*.{ex,exs}"
      root: "backend/"
      run: mix format {staged_files}
      stage_fixed: true

    # Elixir code quality - strict mode
    elixir-credo:
      glob: "backend/{lib,test,config}/**/*.{ex,exs}"
      root: "backend/"
      run: mix credo --strict --all

    # Elixir compilation - ensure no warnings
    elixir-compile:
      glob: "backend/{lib,test,config}/**/*.{ex,exs}"
      root: "backend/"
      run: MIX_ENV=dev mix compile --warnings-as-errors

    # Frontend linting - auto-fix and stage changes
    frontend-lint:
      glob: "frontend/**/*.{svelte,ts,js}"
      root: "frontend/"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

    # Prettier check for the files selected by the hook. The full check remains
    # available through `mise run frontend:format:check`.
    frontend-format:
      glob: "frontend/**/*.{svelte,ts,js}"
      root: "frontend/"
      run: npx prettier --check {staged_files}

    # Svelte type checking
    frontend-check:
      glob: "frontend/**/*.{svelte,ts}"
      root: "frontend/"
      run: npm run check

# Skip hooks with: LEFTHOOK=0 git commit
# Run hooks manually: mise exec -- lefthook run pre-commit
