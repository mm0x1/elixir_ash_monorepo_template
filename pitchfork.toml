#:schema https://pitchfork.jdx.dev/schema.json

namespace = "template_app"

# PostgreSQL is managed by `mise run db:up`; these daemons are the native
# application processes. Run `mise run dev` so the database is ready first.

[daemons.backend]
run = "mix phx.server"
dir = "backend"
mise = true
ready_http = { url = "http://127.0.0.1:4000/health", timeout = "30s" }
retry = 3

[daemons.frontend]
run = "npm run dev"
dir = "frontend"
mise = true
depends = ["backend"]
ready_http = { url = "http://127.0.0.1:5173/", timeout = "30s" }
retry = 3
